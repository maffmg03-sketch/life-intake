<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Morning">
<title>Morning Intake</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg:#f6f8fa; --card:#fff; --ink:#14181f; --muted:#5b6472; --faint:#98a2ae;
    --accent:#2f4a73; --accent-bg:#eef2f8; --accent-bd:#d3ddec; --green:#1f8a4c;
    --amber:#a8790f; --red:#b0403a; --bd:#e6e9ee;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0f1216;--card:#171b21;--ink:#e9edf2;--muted:#9aa4b2;--faint:#6b7683;
          --accent:#7ea2d8;--accent-bg:#1b2330;--accent-bd:#2b3646;--bd:#252c36;}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.45 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
       padding:max(16px,env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom));}
  header{margin:8px 2px 18px}
  h1{font-size:26px;margin:0;letter-spacing:-.4px}
  .sub{color:var(--accent);font-weight:600;font-size:14px;margin-top:4px}
  .ctx{color:var(--faint);font-size:13px;margin-top:2px}
  section{background:var(--card);border:1px solid var(--bd);border-radius:14px;
          padding:14px;margin-bottom:12px}
  .lbl{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);
       font-weight:700;margin-bottom:10px}
  .opts{display:grid;gap:8px}
  .opts.two{grid-template-columns:1fr 1fr}
  .opts.three{grid-template-columns:1fr 1fr 1fr}
  button.opt{appearance:none;border:1.5px solid var(--bd);background:transparent;color:var(--ink);
       border-radius:11px;padding:12px 10px;font-size:14.5px;font-weight:600;cursor:pointer;
       transition:.12s;text-align:center;font-family:inherit}
  button.opt.cand{text-align:left;font-weight:500;font-size:14.5px;line-height:1.35}
  button.opt:active{transform:scale(.97)}
  button.opt[aria-pressed="true"]{background:var(--accent-bg);border-color:var(--accent);
       color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  textarea{width:100%;border:1.5px solid var(--bd);border-radius:11px;
       background:transparent;color:var(--ink);padding:12px;font:inherit;resize:vertical}
  textarea:focus{outline:none;border-color:var(--accent)}
  .hint{color:var(--faint);font-size:12.5px;margin-top:8px}
  footer{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
       background:linear-gradient(to top,var(--bg) 72%,transparent);}
  #send{width:100%;border:0;border-radius:13px;background:var(--accent);color:#fff;
       padding:16px;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer}
  #send:active{transform:scale(.99)}
  #send[disabled]{opacity:.5}
  .ok{text-align:center;padding:40px 16px}
  .ok .big{font-size:44px}
  .err{color:var(--red);font-size:13px;margin-top:8px;text-align:center}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="date">Morning</h1>
    <div class="sub">Six taps. Then your brief.</div>
    <div class="ctx" id="ctx"></div>
  </header>

  <!-- Q1 — THE ONE THING (ranked candidates from the system) -->
  <section>
    <div class="lbl">1 · The one thing today</div>
    <div class="opts" id="one" data-single="1"></div>
    <div id="oneEdit" hidden style="margin-top:10px">
      <textarea id="oneText" rows="2" placeholder="So what IS the one thing today?"></textarea>
      <div class="hint">This becomes the headline of your brief. Dictate with the 🎤 key.</div>
    </div>
  </section>

  <!-- Q2 — energy -->
  <section>
    <div class="lbl">2 · Energy / headspace</div>
    <div class="opts three" id="energy" data-single="1">
      <button class="opt" data-v="good">🟢 Good</button>
      <button class="opt" data-v="ok">🟡 OK</button>
      <button class="opt" data-v="frayed">🔴 Frayed</button>
    </div>
  </section>

  <!-- Q3 — training intent -->
  <section>
    <div class="lbl">3 · Training today</div>
    <div class="opts two" id="training" data-single="1">
      <button class="opt" data-v="scheduled" id="schedBtn">As scheduled</button>
      <button class="opt" data-v="lighter">Lighter than planned</button>
      <button class="opt" data-v="swap">Swap to cardio/F45</button>
      <button class="opt" data-v="rest">Rest instead</button>
    </div>
  </section>

  <!-- Q4 — deep work start -->
  <section>
    <div class="lbl">4 · Deep work starts</div>
    <div class="opts three" id="dw" data-single="1">
      <button class="opt" data-v="now">Right away</button>
      <button class="opt" data-v="after_gym">After the gym</button>
      <button class="opt" data-v="midmorning">Mid-morning</button>
      <button class="opt" data-v="afternoon">Afternoon</button>
      <button class="opt" data-v="none">Not today</button>
    </div>
  </section>

  <!-- Q5 — owed -->
  <section>
    <div class="lbl">5 · Do you owe anyone something?</div>
    <div class="opts three" id="owed" data-single="1">
      <button class="opt" data-v="bri">Bri</button>
      <button class="opt" data-v="student">A student</button>
      <button class="opt" data-v="coauthor">A coauthor</button>
      <button class="opt" data-v="family">Family</button>
      <button class="opt" data-v="none">No one</button>
    </div>
  </section>

  <!-- Q6 — yesterday -->
  <section>
    <div class="lbl">6 · Yesterday, honestly</div>
    <div class="opts two" id="yday" data-single="1">
      <button class="opt" data-v="won">Won it</button>
      <button class="opt" data-v="fine">Fine</button>
      <button class="opt" data-v="scattered">Scattered</button>
      <button class="opt" data-v="lost">Lost it</button>
    </div>
  </section>

  <div class="err" id="err"></div>
</div>

<div id="done" class="ok" hidden>
  <div class="big">✓</div>
  <h1>Got it</h1>
  <div class="sub">Your brief will reflect this.</div>
</div>

<footer id="foot"><button id="send">Send · then brief me</button></footer>

<script>
(function(){
  var qs = new URLSearchParams(location.search);
  // The ntfy topic comes from the URL (your home-screen bookmark), never from this public page.
  var topic = qs.get('t') || localStorage.getItem('intakeTopic') || '';
  if (topic) localStorage.setItem('intakeTopic', topic);

  var d = new Date();
  var iso = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  document.getElementById('date').textContent =
    d.toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'});

  var picked = {};
  function wire(id){
    var box = document.getElementById(id);
    box.addEventListener('click', function(e){
      var b = e.target.closest('button.opt'); if(!b) return;
      [].forEach.call(box.querySelectorAll('button.opt'), function(x){ x.setAttribute('aria-pressed','false'); });
      b.setAttribute('aria-pressed','true');
      picked[id] = b.dataset.v;
      if (id==='one'){
        document.getElementById('oneEdit').hidden = (b.dataset.v!=='__other');
        if(b.dataset.v==='__other') setTimeout(function(){document.getElementById('oneText').focus();},60);
      }
      if (navigator.vibrate) navigator.vibrate(8);
    });
  }
  ['one','energy','training','dw','owed','yday'].forEach(wire);

  // Build Q1 from the system's ranked candidates (published as ctx:{...} at 6:20).
  function buildOne(cands){
    var box=document.getElementById('one'); box.innerHTML='';
    (cands||[]).slice(0,4).forEach(function(c,i){
      var b=document.createElement('button');
      b.className='opt cand'; b.dataset.v=c;
      b.textContent=(i===0?'★ ':'')+c;
      box.appendChild(b);
    });
    var other=document.createElement('button');
    other.className='opt cand'; other.dataset.v='__other';
    other.textContent='✎ Something else…';
    box.appendChild(other);
  }
  buildOne([]);  // empty until ctx loads

  if (topic){
    fetch('https://ntfy.sh/'+topic+'/json?poll=1&since=12h')
      .then(function(r){ return r.text(); })
      .then(function(t){
        var ctx=null;
        t.trim().split('\n').forEach(function(line){
          try{ var m=JSON.parse(line);
            if(m.event==='message' && (m.message||'').indexOf('ctx:')===0){
              ctx = JSON.parse(m.message.slice(4));
            }
          }catch(e){}
        });
        if(ctx){
          var bits=[];
          if(ctx.rec!=null) bits.push('Recovery '+ctx.rec+'%');
          if(ctx.sleep!=null) bits.push('Sleep '+ctx.sleep+'h');
          if(ctx.training) bits.push(ctx.training);
          document.getElementById('ctx').textContent = bits.join(' · ');
          if(ctx.training){
            document.getElementById('schedBtn').textContent='As scheduled ('+ctx.training+')';
          }
          var cands = ctx.candidates && ctx.candidates.length ? ctx.candidates
                     : (ctx.one ? [ctx.one] : []);
          buildOne(cands);
        }
      }).catch(function(){});
  }

  document.getElementById('send').addEventListener('click', function(){
    var err = document.getElementById('err');
    if(!topic){ err.textContent='No topic set — open this from your saved link (…?t=your-topic).'; return; }
    var oneVal = picked.one==='__other' ? document.getElementById('oneText').value.trim()
               : (picked.one || '');
    var payload = {
      one: oneVal,
      one_confirmed: (picked.one && picked.one!=='__other') ? '1' : '',
      energy: picked.energy || '',
      training: picked.training || '',
      dw: picked.dw || '',
      owed: picked.owed || '',
      yday: picked.yday || ''
    };
    var btn=this; btn.disabled=true; btn.textContent='Sending…';
    fetch('https://ntfy.sh/'+topic, {
      method:'POST',
      body:'intake:'+iso+':json:'+JSON.stringify(payload)
    }).then(function(r){
      if(!r.ok) throw new Error(r.status);
      document.getElementById('app').hidden=true;
      document.getElementById('foot').hidden=true;
      document.getElementById('done').hidden=false;
      if (navigator.vibrate) navigator.vibrate([10,40,10]);
    }).catch(function(e){
      btn.disabled=false; btn.textContent='Send · then brief me';
      err.textContent='Could not send ('+e.message+'). Check signal and retry.';
    });
  });
})();
</script>
</body>
</html>
